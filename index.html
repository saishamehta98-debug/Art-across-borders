<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art Across Borders</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link rel="stylesheet" href="https://googleapis.com/css2?family=Rozha+One&family=Mukta:wght@300;400;600&display=swap">
<style>
:root {
  --bg: #eef0ef;
  --surface: #ffffff;
  --fg: #1d2430;
  --muted: #5b6672;
  --cobalt: #1f3fa6;
  --ochre: #b8925c;
  --line: #d3d8dc;
  --display: "Rozha One", Georgia, "Times New Roman", serif;
  --body: "Mukta", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141922;
    --surface: #1c2330;
    --fg: #e8eaee;
    --muted: #9aa4b2;
    --cobalt: #8ea6ff;
    --ochre: #d6b07a;
    --line: #2c3545;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.wrap {
  max-width: 1160px;
  width: 100%;
  margin: 0 auto;
  padding: 0 24px;
}
.hero {
  position: relative;
  color: #ffffff;
  background: linear-gradient(rgba(20, 25, 34, 0.72), rgba(20, 25, 34, 0.85)), url("images/image1.jpg") center/cover no-repeat;
  padding: 120px 0 100px;
  border-bottom: 4px solid var(--ochre);
}
.eyebrow {
  font-size: 0.82rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ochre);
  font-weight: 600;
  margin-bottom: 16px;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  line-height: 1.05;
  margin: 0 0 24px;
  max-width: 820px;
}
.subtitle {
  font-size: 1.25rem;
  max-width: 640px;
  color: #e8eaee;
  margin: 0 0 36px;
  font-weight: 300;
}
.btn {
  display: inline-block;
  background: var(--cobalt);
  color: #ffffff;
  text-decoration: none;
  padding: 14px 28px;
  border-radius: 6px;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid rgba(255, 255, 255, 0.15);
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover {
  background: #173082;
  transform: translateY(-2px);
}
.gallery-section {
  padding: 64px 0;
  flex: 1;
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  transition: transform 0.2s ease;
}
.card:hover {
  transform: translateY(-3px);
}
.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
}
footer {
  border-top: 1px solid var(--line);
  padding: 32px 0;
  color: var(--muted);
  font-size: 0.95rem;
}
footer .wrap {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Art Across Borders &middot; Showcased at the Peace Conference</div>
    <h1>Displacement, Citizenship &amp; Belonging</h1>
    <p class="subtitle">How displacement shapes identity and citizenship. 15 oral histories documented through art, voice, and personal narrative.</p>
    <a href="#collection" class="btn">View the photo collection here &rarr;</a>
  </div>
</header>

<main id="collection" class="gallery-section">
  <div class="wrap">
    <div id="gallery" class="gallery-grid"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span><strong>Art Across Borders</strong></span>
    <span>Founder: Saisha Mehta</span>
  </div>
</footer>

<script>
  const gallery = document.getElementById('gallery');
  for (let i = 2; i <= 109; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = `images/image${i}.jpg`;
    img.alt = `Exhibition Artwork ${i}`;
    img.loading = 'lazy';
    img.onerror = function() { card.style.display = 'none'; };
    card.appendChild(img);
    gallery.appendChild(card);
  }
</script>

</body>
</html>
