<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art Across Borders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@300;400;600&display=swap">
<style>
/* Layout: a market lane — full-bleed photo opener, then a grid of 15 stalls, each one a story */
:root{
  --bg:#eef0ef; --surface:#ffffff; --fg:#1d2430; --muted:#5b6672;
  --cobalt:#1f3fa6; --ochre:#b8925c; --line:#d3d8dc;
  --display:"Rozha One", Georgia, "Times New Roman", serif;
  --body:"Mukta", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141922; --surface:#1c2330; --fg:#e8eaee; --muted:#9aa4b2;
  --cobalt:#8ea6ff; --ochre:#d6b07a; --line:#2c3545; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1c2330; --fg:#e8eaee; --muted:#9aa4b2;
  --cobalt:#8ea6ff; --ochre:#d6b07a; --line:#2c3545; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
a{color:var(--cobalt)}
a:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Fixes for image styling and container layout */
.content-area {
  padding: 40px 0;
}
img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 20px auto;
  border-radius: 8px;
}
</style>
</head>
<body>

<div class="wrap">
  <header class="content-area">
    <p class="eyebrow">Welcome</p>
    <h1>Art Across Borders</h1>
  </header>

  <main class="content-area">
    <!-- Place your images and paragraphs inside here -->
    <p>Your document text goes here...</p>
    
    <!-- Example of how to show your images inside the folder -->
    <img src="images/image1.jpg" alt="Art Piece 1">
    <img src="images/image2.jpg" alt="Art Piece 2">
  </main>
</div>

</body>
</html>
