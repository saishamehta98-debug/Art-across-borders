<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art Across Borders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link rel="stylesheet" href="https://googleapis.com/css2?family=Rozha+One&family=Mukta:wght@300;400;600&display=swap">
<style>
/* Layout: a market lane — full-bleed photo opener, then a grid of 15 stalls, each one a story */
:root{
  --bg:#eef0ef; --surface:#ffffff; --fg:#1d2430; --muted:#5b6672;
  --cobalt:#1f3fa6; --ochre:#b8925c; --line:#d3d8dc;
  --display:"Rozha One", Georgia, "Times New Roman", serif;
  --body:"Mukta", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141922; --surface:#1c2330; --fg:#e8eaee; --muted:#9aa4b2;
  --cobalt:#8ea6ff; --ochre:#d6b07a; --line:#2c3545; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1c2330; --fg:#e8eaee; --muted:#9aa4b2;
  --cobalt:#8ea6ff; --ochre:#d6b07a; --line:#2c3545; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
a{color:var(--cobalt)}
a:focus-visible,button:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Grid Layout for the 15 Market Stalls */
.market-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
  padding: 40px 0;
}
.stall {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 24px;
  border-radius: 12px;
}
.stall img {
  max-width: 100%;
  height: auto;
  display: block;
  margin-bottom: 15px;
  border-radius: 6px;
}
.hero {
  padding: 80px 20px;
  text-align: center;
  background: var(--cobalt);
  color: #fff;
  border-radius: 0 0 20px 20px;
}
.hero h1 { color: #fff; font-size: 3rem; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="wrap">
  <!-- Hero Header -->
  <header class="hero">
    <p class="eyebrow" style="color: var(--ochre);">Welcome</p>
    <h1>Art Across Borders</h1>
  </header>

  <!-- Market Grid with Stories -->
  <main class="market-grid">
    
    <!-- Stall 1 -->
    <div class="stall">
      <img src="images/image1.jpg" alt="Art 1">
      <h2>Stall 1 Heading</h2>
      <p>Your first story text goes here...</p>
    </div>

    <!-- Stall 2 -->
    <div class="stall">
      <img src="images/image2.jpg" alt="Art 2">
      <h2>Stall 2 Heading</h2>
      <p>Your second story text goes here...</p>
    </div>

    <!-- Stall 3 -->
    <div class="stall">
      <img src="images/image3.jpg" alt="Art 3">
      <h2>Stall 3 Heading</h2>
      <p>Your third story text goes here...</p>
    </div>

    <!-- Add more stalls up to 15 following this exact pattern -->

  </main>
</div>

</body>
</html>
